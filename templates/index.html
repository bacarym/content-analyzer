          async analyzeBatch(list) {
            this.analyzing = true;
            const ids = list.map((b) => b.tweet_id);
            const total = ids.length;
            let done = 0,
              errors = 0;
            this.analyzeProgress = `0/${total}`;
            const CHUNK = 5;
            const PARALLEL = 10;
            try {
              const chunks = [];
              for (let i = 0; i < total; i += CHUNK)
                chunks.push(ids.slice(i, i + CHUNK));
              for (let w = 0; w < chunks.length; w += PARALLEL) {
                const wave = chunks.slice(w, w + PARALLEL);
                const responses = await Promise.all(
                  wave.map((chunk) =>
                    fetch("/api/reanalyze-batch", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(chunk),
                    })
                      .then((r) =>
                        r.ok
                          ? r.json()
                          : {
                              results: chunk.map(() => ({
                                error: "server error",
                              })),
                            },
                      )
                      .catch(() => ({
                        results: chunk.map(() => ({ error: "network error" })),
                      })),
                  ),
                );
                let overloaded = false;
                for (const d of responses) {
                  const results = d.results || [];
                  done += results.filter((r) => r.verdict).length;
                  errors += results.filter((r) => r.error).length;
                  if (results.some((r) => r.error === "overloaded")) overloaded = true;
                  results
                    .filter((r) => r.error)
                    .forEach((r) =>
                      console.error(`[Analyse] ${r.tweet_id}:`, r.error),
                    );
                }
                this.analyzeProgress = `${done + errors}/${total}`;
                if (overloaded) break;
              }
              if (overloaded) {
                this.showToast(this.t("L'API Claude est surchargée", "Claude API is overloaded"), "error");
              } else if (errors > 0) {
                this.showToast(this.t(`${done} OK, ${errors} erreur(s)`, `${done} OK, ${errors} error(s)`), "error");
              } else {
                this.showToast(this.t(`${done} analyses terminées`, `${done} analyses completed`));
              }
            } catch (e) {
              console.error("[Analyse batch] error:", e);
              this.showToast(this.t("Erreur réseau", "Network error"), "error");
            }
            await this.loadData();
            this.analyzing = false;
          },

          async reanalyze(tweetId) {
            this.analyzing = true;
            try {
              const r = await fetch(`/api/reanalyze/${tweetId}`, { method: "POST" });
              if (r.status === 529) {
                this.showToast(this.t("L'API Claude est surchargée", "Claude API is overloaded"), "error", () => this.reanalyze(tweetId));
              } else if (r.ok) {
                this.showToast(this.t("Re-analyse terminée", "Re-analysis complete"));
              } else {
                const d = await r.json().catch(() => ({}));
                this.showToast(d.error || this.t("Erreur analyse", "Analysis error"), "error");
              }
              await this.loadData();
            } catch (e) {
              this.showToast(this.t("Erreur réseau", "Network error"), "error");
            } finally {
              this.analyzing = false;
            }
          },

          async reanalyzeBatch(ids) {
            const n = ids.length;
            const mins = Math.ceil(n * 0.4);
            if (!confirm(this.t(`Re-analyser ${n} éléments ?\n\n≈ ${mins} min · ${n} appels Claude\nLes analyses existantes seront écrasées.`, `Re-analyze ${n} items?\n\n≈ ${mins} min · ${n} Claude calls\nExisting analyses will be overwritten.`))) return;
            await this.analyzeBatch(ids.map((id) => ({ tweet_id: id })));
          },

          async submitAdHoc() {
            if (!this.addUrls.trim() && !this.addFiles) {
              this.showToast(this.t("Ajoute au moins un lien ou un fichier", "Add at least one link or file"), "error");
              return;
            }
            this.adHocLoading = true;
            const fd = new FormData();
            fd.append("urls", this.addUrls);
            if (this.addFiles) {
              for (const f of this.addFiles) fd.append("files", f);
            }
            try {
              const r = await fetch("/api/analyze", {
                method: "POST",
                body: fd,
              });
              const d = await r.json();
              if (d.error) {
                this.showToast(d.error, "error");
              } else {
                const n = d.results?.length || 0;
                const overloaded = (d.results || []).some((r) => r.error === "overloaded");
                const errors = (d.results || []).filter((r) => r.error).length;
                if (overloaded) {
                  this.showToast(this.t("L'API Claude est surchargée", "Claude API is overloaded"), "error", () => this.submitAdHoc());
                } else if (errors) {
                  const errMsg = (d.results || []).find((r) => r.error)?.error || this.t("Erreur inconnue", "Unknown error");
                  this.showToast(errMsg, "error");
                } else {
                  this.showToast(this.t(`${n} analyse(s) OK`, `${n} analysis(es) OK`));
                }
                this.addUrls = "";
                this.addFiles = null;
                await this.loadData();
              }
            } catch (e) {
              this.showToast(this.t("Erreur : ", "Error: ") + e.message, "error");
            } finally {
              this.adHocLoading = false;
            }
          },

          async generateBrief() {
            this.generatingBrief = true;
            this.currentBrief = null;
            const fd = new FormData();
            fd.append("request_text", this.briefRequest);
            fd.append("min_quality", this.briefQuality);
            try {
              const r = await fetch("/api/brief/generate", {
                method: "POST",
                body: fd,
              });
              const d = await r.json();
              if (d.error) {
                this.showToast(d.error, "error");
                return;
              }
              this.currentBrief = d;
              this.showToast(this.t("Brief généré", "Brief generated"));
              await this.loadBriefs();
            } catch (e) {
              this.showToast(this.t("Erreur", "Error"), "error");
            } finally {
              this.generatingBrief = false;
            }
          },

          async loadBriefs() {
            try {
              const r = await fetch("/api/briefs");
              this.briefs = (await r.json()).map((b) => ({
                ...b,
                _open: false,
              }));
            } catch (e) {}
          },

          async deleteBrief(id) {
            await fetch(`/api/briefs/${id}`, { method: "DELETE" });
            this.briefs = this.briefs.filter((b) => b.id !== id);
            this.showToast(this.t("Brief supprimé", "Brief deleted"));
          },

          copyToClipboard(text) {
            navigator.clipboard.writeText(text || "");
            this.showToast(this.t("Copié !", "Copied!"));
          },

          openChat() {
            if (!this.selectedBm) return;
            this.chatMode = "bookmark";
            if (
              !this.chatMessages.length ||
              this._chatBmId !== this.selectedBm.tweet_id
            ) {
              this.chatMessages = [];
              this._chatBmId = this.selectedBm.tweet_id;
            }
            this.chatOpen = true;
            this.$nextTick(() => this.scrollChat());
          },

          openBriefChat(brief) {
            if (!brief || !brief.id) return;
            this.chatMode = "brief";
            this.chatBriefId = brief.id;
            this.chatBriefData = brief.data || {};
            if (this._chatBriefId !== brief.id) {
              this.chatMessages = [];
              this._chatBriefId = brief.id;
            }
            this.chatOpen = true;
            this.$nextTick(() => this.scrollChat());
          },

          scrollChat() {
            const el = this.$refs.chatScroll;
            if (el) el.scrollTop = el.scrollHeight;
          },

          renderChat(text) {
            if (!text) return "";
            return text
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(
                /\*\*(.+?)\*\*/g,
                '<strong class="text-white font-medium">$1</strong>',
              )
              .replace(
                /`(.+?)`/g,
                '<code class="px-1 py-0.5 rounded bg-white/10 text-[#E85D00] text-xs">$1</code>',
              )
              .replace(/\n/g, "<br>");
          },

          async sendChat() {
            const msg = this.chatInput.trim();
            if (!msg || this.chatLoading) return;
            if (this.chatMode === "bookmark" && !this.selectedBm) return;
            if (this.chatMode === "brief" && !this.chatBriefId) return;
            this.chatMessages.push({ role: "user", content: msg });
            this.chatInput = "";
            this.chatLoading = true;
            const ml = msg.toLowerCase();
            if (ml.includes('reddit')) this.chatStatusText = this.t('Crawl Reddit en cours...', 'Crawling Reddit...');
            else if (ml.includes('deep research') || ml.includes('approfondie')) this.chatStatusText = this.t('Recherche multi-sources...', 'Multi-source research...');
            else if (ml.includes('recherche') || ml.includes('search') || ml.includes('cherche')) this.chatStatusText = this.t('Recherche web...', 'Web search...');
            else this.chatStatusText = this.t('Réflexion...', 'Thinking...');
            this.$nextTick(() => this.scrollChat());
            try {
              let url, payload;
              const history = this.chatMessages.filter((m) => m.role !== "typing").slice(-10);
              if (this.chatMode === "brief") {
                url = "/api/brief/chat";
                payload = { brief_id: this.chatBriefId, message: msg, history };
              } else {
                url = "/api/chat";
                payload = { message: msg, tweet_id: this.selectedBm.tweet_id, history };
              }
              const r = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
              const d = await r.json();
              if (d.error) {
                this.chatMessages.push({ role: "assistant", content: this.t("Erreur : ", "Error: ") + d.error });
              } else {
                this.chatMessages.push({ role: "assistant", content: d.reply });
                // If brief was updated by Claude, refresh the brief data
                if (d.updated_brief && this.chatMode === "brief") {
                  this.chatBriefData = d.updated_brief;
                  // Update in briefs list
                  const idx = this.briefs.findIndex((b) => b.id === this.chatBriefId);
                  if (idx >= 0) this.briefs[idx].data = d.updated_brief;
                  // Update currentBrief if it matches
                  if (this.currentBrief && this.currentBrief.project_name === d.updated_brief.project_name) {
                    this.currentBrief = d.updated_brief;
                  }
                  this.chatMessages.push({
                    role: "assistant",
                    content: this.t("**Brief mis à jour** — les modifications sont appliquées.", "**Brief updated** — changes have been applied."),
                  });
                }
              }
            } catch (e) {
              this.chatMessages.push({ role: "assistant", content: this.t("Erreur de connexion.", "Connection error.") });
            } finally {
              this.chatLoading = false;
              this.chatStatusText = "";
              this.$nextTick(() => this.scrollChat());
            }
          },
        };
      }
    </script>
  </body>
</html>
