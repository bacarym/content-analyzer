<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGNL — Content Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Figtree", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        font-family:
          "Figtree",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .mask-fade-bottom {
        -webkit-mask-image: linear-gradient(
          to bottom,
          black 85%,
          transparent 100%
        );
        mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
      }
      .bottom-glow {
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
      }
      iconify-icon {
        stroke-width: 1.5;
      }
      .fade-in {
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .spinner {
        border: 2px solid rgba(232, 93, 0, 0.2);
        border-top-color: #E85D00;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        animation: spin 0.6s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .btn-primary {
        background: #E85D00;
      }
      .btn-primary:hover {
        background: #FF6B00;
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-in, .spinner, .animate-pulse, .animate-spin, .animate-bounce {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body
    class="bg-[#0B0A08] text-[#E5E1DB] antialiased selection:bg-[#E85D00]/30 selection:text-white h-screen overflow-hidden flex"
    x-data="app()"
    x-init="init()"
    @keydown.escape.window="if (chatOpen) { chatOpen = false } else if (selectedBm) { selectedBm = null }"
    @keydown.slash.window.prevent="if (!chatOpen && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { $refs.searchInput?.focus() }"
    @keydown.window="if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || chatOpen) return; if ($event.key === 'j') selectNext(); if ($event.key === 'k') selectPrev();"
  >
    <!-- ═══ Sidebar (desktop) ═══ -->
    <aside
      class="hidden md:flex w-64 shrink-0 flex-col border-r border-white/[0.05] bg-[#0B0A08] z-20"
    >
      <div class="h-16 flex items-center px-6 border-b border-white/[0.05]">
        <span class="text-xl font-medium tracking-tighter text-white"
          >SGNL</span
        >
        <span class="ml-3 text-xs text-[#6B665F] uppercase tracking-widest mt-1"
          >Analyzer</span
        >
      </div>
      <nav class="flex-1 px-3 py-6 space-y-6 overflow-y-auto no-scrollbar">
        <div class="space-y-1">
          <div
            class="text-xs font-medium text-[#8E887F] px-3 mb-3 uppercase tracking-widest"
          >
            <span x-text="t('Plateforme', 'Platform')"></span>
          </div>
          <button
            type="button"
            @click="tab = 'bookmarks'; selectedBm = null"
            :class="tab === 'bookmarks' ? 'bg-white/[0.08] text-white' : 'text-[#8E887F] hover:text-[#D1CBC4] hover:bg-white/[0.03]'"
            class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-colors"
          >
            <iconify-icon
              icon="solar:compass-linear"
              class="text-lg shrink-0"
            ></iconify-icon>
            <span class="text-sm font-medium" x-text="t('Explorer', 'Explore')"></span>
          </button>
          <button
            type="button"
            @click="tab = 'backlog'; selectedBm = null"
            :class="tab === 'backlog' ? 'bg-white/[0.08] text-white' : 'text-[#8E887F] hover:text-[#D1CBC4] hover:bg-white/[0.03]'"
            class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-colors"
          >
            <iconify-icon
              icon="solar:checklist-minimalistic-linear"
              class="text-lg shrink-0"
            ></iconify-icon>
            <span class="text-sm font-medium">Backlog</span>
            <span
              class="ml-auto bg-[#1C1A17] text-xs px-1.5 py-0.5 rounded text-[#8E887F]"
              x-show="backlogIdeaCount > 0"
              x-text="backlogIdeaCount"
            ></span>
          </button>
        </div>
        <div class="space-y-1">
          <div
            class="text-xs font-medium text-[#8E887F] px-3 mb-3 uppercase tracking-widest"
          >
            <span x-text="t('Résultats', 'Output')"></span>
          </div>
          <button
            type="button"
            @click="tab = 'brief'; selectedBm = null"
            :class="tab === 'brief' ? 'bg-white/[0.08] text-white' : 'text-[#8E887F] hover:text-[#D1CBC4] hover:bg-white/[0.03]'"
            class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-colors"
          >
            <iconify-icon
              icon="solar:document-text-linear"
              class="text-lg shrink-0"
            ></iconify-icon>
            <span class="text-sm font-medium">Briefs</span>
          </button>
          <button
            type="button"
            @click="tab = 'bookmarks'; filter.verdict = ''; selectedBm = null"
            class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-colors text-[#8E887F] hover:text-[#D1CBC4] hover:bg-white/[0.03]"
          >
            <iconify-icon
              icon="solar:history-linear"
              class="text-lg shrink-0"
            ></iconify-icon>
            <span class="text-sm font-medium" x-text="t('Historique', 'History')"></span>
          </button>
        </div>
      </nav>
      <div class="p-3 border-t border-white/[0.05]">
        <button
          type="button"
          @click="tab = 'settings'; selectedBm = null"
          :class="tab === 'settings' ? 'bg-white/[0.08] text-white' : 'text-[#8E887F] hover:text-[#D1CBC4] hover:bg-white/[0.03]'"
          class="flex items-center gap-3 w-full px-3 py-2 rounded-lg transition-colors"
        >
          <iconify-icon
            icon="solar:settings-linear"
            class="text-lg shrink-0"
          ></iconify-icon>
          <span class="text-sm font-medium" x-text="t('Réglages', 'Settings')"></span>
          <span
            class="ml-auto w-2 h-2 rounded-full"
            :class="connected ? 'bg-[#34C759]' : 'bg-[#8E887F]'"
          ></span>
        </button>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main
      class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative"
    >

      <!-- ═══ LEFT COLUMN: List / Explore ═══ -->
      <section
        class="w-full md:w-[380px] lg:w-[420px] flex flex-col border-r border-white/[0.05] bg-[#0B0A08] z-10 h-full relative"
        :class="{ 'hidden md:flex': selectedBm && tab === 'bookmarks' }"
        x-show="tab === 'bookmarks'"
      >
        <!-- Header & Import -->
        <div
          class="px-5 pt-6 pb-4 flex flex-col gap-4 border-b border-white/[0.05] bg-[#0B0A08] sticky top-0 z-20"
        >
          <div class="flex justify-between items-center">
            <h1 class="text-xl font-medium tracking-tight text-white" x-text="t('Explorer', 'Explore')">
            </h1>
            <div class="flex items-center gap-1.5">
              <button
                type="button"
                @click="refreshData()"
                :disabled="refreshing"
                class="w-10 h-10 md:w-9 md:h-9 rounded-full bg-[#1C1A17] flex items-center justify-center text-[#D1CBC4] hover:bg-[#2C2A26] transition-colors border border-white/5"
                title="Rafraîchir"
              >
                <iconify-icon
                  icon="solar:refresh-linear"
                  class="text-lg"
                  :class="refreshing && 'animate-spin'"
                ></iconify-icon>
              </button>
              <template x-if="connected">
                <button
                  type="button"
                  @click="importBookmarks()"
                  :disabled="importing"
                  class="w-10 h-10 md:w-9 md:h-9 rounded-full bg-[#1C1A17] flex items-center justify-center text-[#D1CBC4] hover:bg-[#2C2A26] transition-colors border border-white/5"
                  :title="t('Importer bookmarks X', 'Import X bookmarks')"
                >
                  <span x-show="!importing"
                    ><iconify-icon
                      icon="solar:download-minimalistic-linear"
                      class="text-lg"
                    ></iconify-icon
                  ></span>
                  <span x-show="importing" class="spinner"></span>
                </button>
              </template>
              <template x-if="!connected">
                <button
                  type="button"
                  @click="tab = 'settings'"
                  class="w-10 h-10 md:w-9 md:h-9 rounded-full bg-[#1C1A17] flex items-center justify-center text-[#8E887F] hover:text-[#D1CBC4] transition-colors border border-white/5"
                  :title="t('Connecter X via Réglages', 'Connect X via Settings')"
                >
                  <iconify-icon
                    icon="solar:link-circle-linear"
                    class="text-lg"
                  ></iconify-icon>
                </button>
              </template>
            </div>
          </div>

          <!-- Quick Import Widget -->
          <div
            class="bg-[#14120F] rounded-xl p-1 border border-white/[0.03] flex items-center relative overflow-hidden group focus-within:border-white/10 transition-colors"
          >
            <input
              type="text"
              x-model="addUrls"
              placeholder="Paste link or drop file..."
              class="w-full bg-transparent border-none outline-none text-sm px-3 py-2 text-[#E5E1DB] placeholder-[#6B665F] relative z-10 font-light"
            />
            <div class="flex items-center gap-1 pr-1 relative z-10">
              <button
                type="button"
                @click="showAddPanel = !showAddPanel"
                class="p-1.5 rounded-lg text-[#8E887F] hover:text-white hover:bg-white/5 transition-colors"
                title="Upload fichier"
              >
                <iconify-icon
                  icon="solar:link-circle-linear"
                  class="text-lg"
                ></iconify-icon>
              </button>
              <button
                type="button"
                @click="submitAdHoc()"
                :disabled="adHocLoading"
                class="p-1.5 rounded-lg bg-white/5 text-white hover:bg-white/10 transition-colors"
                title="Analyser"
              >
                <span x-show="!adHocLoading"
                  ><iconify-icon
                    icon="solar:magic-stick-3-linear"
                    class="text-lg"
                  ></iconify-icon
                ></span>
                <span
                  x-show="adHocLoading"
                  class="spinner"
                  style="width: 14px; height: 14px; border-width: 1.5px"
                ></span>
              </button>
            </div>
          </div>

          <!-- File upload panel (collapsible) -->
          <div x-show="showAddPanel" x-transition class="space-y-2">
            <input
              type="file"
              multiple
              @change="addFiles = $event.target.files"
              class="w-full text-xs text-[#8E887F] file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-[#2C2A26] file:text-[#E5E1DB] file:text-xs"
            />
          </div>

          <!-- Filters -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            <button
              type="button"
              @click="filter.verdict = ''"
              :class="!filter.verdict ? 'bg-white/10 text-white border border-white/5' : 'bg-transparent hover:bg-white/5 text-[#8E887F]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors"
              x-text="t('Tout', 'All')"
            >
            </button>
            <button
              type="button"
              @click="filter.verdict = 'SIGNAL'"
              :class="filter.verdict === 'SIGNAL' ? 'bg-[#34C759]/15 text-[#34C759] border border-[#34C759]/20' : 'bg-transparent hover:bg-white/5 text-[#8E887F]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors flex items-center gap-1.5"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-[#34C759]"></span> Signal
              <span
                class="text-[10px] opacity-70"
                x-text="counts.signal || 0"
              ></span>
            </button>
            <button
              type="button"
              @click="filter.verdict = 'MIXED'"
              :class="filter.verdict === 'MIXED' ? 'bg-[#FFCC00]/15 text-[#FFCC00] border border-[#FFCC00]/20' : 'bg-transparent hover:bg-white/5 text-[#8E887F]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors flex items-center gap-1.5"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-[#FFCC00]"></span> Mixed
              <span
                class="text-[10px] opacity-70"
                x-text="counts.mixed || 0"
              ></span>
            </button>
            <button
              type="button"
              @click="filter.verdict = 'NOISE'"
              :class="filter.verdict === 'NOISE' ? 'bg-[#FF3B30]/15 text-[#FF3B30] border border-[#FF3B30]/20' : 'bg-transparent hover:bg-white/5 text-[#8E887F]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors flex items-center gap-1.5"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-[#FF3B30]"></span> Noise
              <span
                class="text-[10px] opacity-70"
                x-text="counts.noise || 0"
              ></span>
            </button>
            <button
              type="button"
              @click="filter.verdict = 'NONE'"
              :class="filter.verdict === 'NONE' ? 'bg-white/10 text-white border border-white/5' : 'bg-transparent hover:bg-white/5 text-[#8E887F]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors"
            >
              Pending
              <span
                class="text-[10px] opacity-70"
                x-text="counts.unanalyzed || 0"
              ></span>
            </button>
          </div>

          <!-- Search bar + sort -->
          <div class="flex items-center gap-2">
            <div
              class="flex-1 flex items-center bg-[#14120F] rounded-lg border border-white/[0.03] px-3 py-1.5"
            >
              <iconify-icon
                icon="solar:magnifier-linear"
                class="text-[#6B665F] mr-2 text-sm"
              ></iconify-icon>
              <input
                type="text"
                x-model="filter.search"
                x-ref="searchInput"
                placeholder="Rechercher...  ( / )"
                class="bg-transparent border-none outline-none text-xs text-[#E5E1DB] placeholder-[#6B665F] w-full font-light"
              />
            </div>
            <select
              x-model="sortBy"
              class="bg-[#14120F] border border-white/[0.03] rounded-lg px-2 py-1.5 text-xs text-[#8E887F] outline-none appearance-none cursor-pointer"
              style="color-scheme: dark"
            >
              <option value="fetched_desc" x-text="t('Import récent', 'Recent import')"></option>
              <option value="fetched_asc" x-text="t('Import ancien', 'Oldest import')"></option>
              <option value="created_desc" x-text="t('Tweet récent', 'Recent tweet')"></option>
              <option value="created_asc" x-text="t('Tweet ancien', 'Oldest tweet')"></option>
              <option value="verdict">Verdict</option>
              <option value="author" x-text="t('Auteur', 'Author')"></option>
            </select>
          </div>

          <!-- Toggle filters button -->
          <div class="flex items-center gap-2">
            <button
              type="button"
              @click="filtersOpen = !filtersOpen"
              class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs transition-colors"
              :class="filtersOpen || filter.tag || dateFrom || dateTo ? 'text-[#E85D00] bg-[#E85D00]/10' : 'text-[#8E887F] hover:text-white hover:bg-white/5'"
            >
              <iconify-icon icon="solar:tuning-2-linear" class="text-sm"></iconify-icon>
              <span x-text="t('Filtres', 'Filters')"></span>
              <iconify-icon icon="solar:alt-arrow-down-linear" class="text-[10px]" :class="filtersOpen && 'rotate-180'" style="transition:transform 0.2s"></iconify-icon>
            </button>
            <span
              x-show="filter.tag || dateFrom || dateTo"
              class="text-[10px] text-[#E85D00]"
              x-text="[filter.tag, dateFrom, dateTo].filter(Boolean).join(' · ')"
            ></span>
          </div>

          <!-- Collapsible filters -->
          <template x-if="filtersOpen">
          <div class="space-y-3 fade-in">
          <!-- Topic + Date filters -->
          <div class="flex items-center gap-2">
            <div class="flex-1 relative" x-data="{ open: false }">
              <button
                type="button"
                @click="open = !open"
                class="w-full flex items-center justify-between bg-[#14120F] border border-white/[0.03] rounded-lg px-3 py-1.5 text-xs text-left transition-colors"
                :class="filter.tag ? 'text-[#E85D00]' : 'text-[#6B665F]'"
              >
                <span class="flex items-center gap-1.5 truncate">
                  <iconify-icon
                    icon="solar:tag-linear"
                    class="text-sm shrink-0"
                  ></iconify-icon>
                  <span x-text="filter.tag || 'Topic'"></span>
                </span>
                <iconify-icon
                  icon="solar:alt-arrow-down-linear"
                  class="text-[10px] shrink-0 transition-transform"
                  :class="open && 'rotate-180'"
                ></iconify-icon>
              </button>
              <div
                x-show="open"
                @click.away="open = false"
                x-transition
                class="absolute top-full mt-1 left-0 right-0 bg-[#1C1A17] border border-white/[0.08] rounded-xl shadow-2xl z-30 max-h-48 overflow-y-auto no-scrollbar py-1"
              >
                <button
                  type="button"
                  @click="filter.tag = ''; open = false"
                  class="w-full text-left px-3 py-2 text-xs hover:bg-white/5 transition-colors"
                  :class="!filter.tag ? 'text-[#E85D00]' : 'text-[#8E887F]'"
                >
                  <span x-text="t('Tous les topics', 'All topics')"></span>
                </button>
                <template x-for="t in allTags" :key="t">
                  <button
                    type="button"
                    @click="filter.tag = t; open = false"
                    class="w-full text-left px-3 py-2 text-xs hover:bg-white/5 transition-colors truncate"
                    :class="filter.tag === t ? 'text-[#E85D00]' : 'text-[#D1CBC4]'"
                    x-text="t"
                  ></button>
                </template>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <input
                type="date"
                x-ref="dateFromInput"
                class="bg-[#14120F] border border-white/[0.03] rounded-lg px-2 py-1.5 text-[10px] text-[#8E887F] outline-none w-[110px] [color-scheme:dark]"
                title="Date début"
              />
              <span class="text-[#6B665F] text-[10px]">→</span>
              <input
                type="date"
                x-ref="dateToInput"
                class="bg-[#14120F] border border-white/[0.03] rounded-lg px-2 py-1.5 text-[10px] text-[#8E887F] outline-none w-[110px] [color-scheme:dark]"
                title="Date fin"
              />
              <button
                type="button"
                @click="applyDateFilter()"
                class="px-2.5 py-1.5 rounded-lg text-[10px] font-medium text-[#E85D00] bg-[#E85D00]/10 border border-[#E85D00]/20 hover:bg-[#E85D00]/20 transition-colors shrink-0"
              >
                OK
              </button>
            </div>
            <button
              type="button"
              x-show="filter.tag || dateFrom || dateTo"
              @click="clearDateFilters(); $refs.dateFromInput.value = ''; $refs.dateToInput.value = ''"
              class="w-7 h-7 rounded-full bg-[#1C1A17] flex items-center justify-center text-[#8E887F] hover:text-[#FF3B30] border border-white/5 transition-colors shrink-0"
              title="Reset filtres"
            >
              <iconify-icon
                icon="solar:close-circle-linear"
                class="text-sm"
              ></iconify-icon>
            </button>
          </div>

          <!-- Batch actions -->
          <div
            class="flex items-center gap-2 flex-wrap"
            x-show="filtered.length > 0"
          >
            <button
              x-show="filteredPending.length > 0 && !analyzing"
              type="button"
              @click="analyzeBatch(filteredPending)"
              class="px-3 py-1.5 rounded-lg text-xs font-medium text-white btn-primary flex items-center gap-1.5"
            >
              <span x-text="t(`Analyser ${filteredPending.length}`, `Analyze ${filteredPending.length}`)"></span>
            </button>
            <button
              x-show="!analyzing"
              type="button"
              @click="reanalyzeBatch(filtered.map(b => b.tweet_id))"
              class="px-3 py-1.5 rounded-lg text-[10px] font-medium text-[#FFCC00] bg-[#FFCC00]/10 border border-[#FFCC00]/20 hover:bg-[#FFCC00]/20 transition-colors"
            >
              <span
                x-text="(dateFrom || dateTo || filter.tag) ? t(`Re-analyser ${filtered.length} filtrés`, `Re-analyze ${filtered.length} filtered`) : t('Re-analyser tout', 'Re-analyze all')"
              ></span>
            </button>
            <div
              x-show="analyzing"
              class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#E85D00]/10 border border-[#E85D00]/20"
            >
              <span
                class="spinner"
                style="width: 12px; height: 12px; border-width: 1.5px"
              ></span>
              <span
                class="text-xs font-medium text-[#E85D00]"
                x-text="analyzeProgress"
              ></span>
            </div>
            <span
              class="text-[10px] text-[#6B665F] ml-auto"
              x-text="t(`${filtered.length} résultats`, `${filtered.length} results`)"
            ></span>
          </div>
          </div>
          </template>
        </div>

        <!-- Card List with pull-to-refresh -->
        <div
          class="flex-1 overflow-y-auto no-scrollbar mask-fade-bottom pb-20"
          x-ref="listScroll"
          @touchstart="pullStartY = $event.touches[0].clientY; pulling = false; pullDistance = 0;"
          @touchmove="if ($refs.listScroll.scrollTop <= 0 && $event.touches[0].clientY - pullStartY > 0) { pulling = true; pullDistance = Math.max(0, Math.min(80, $event.touches[0].clientY - pullStartY)); if (pullDistance > 2) $event.preventDefault(); } else { pulling = false; pullDistance = 0; }"
          @touchend="if (pulling && pullDistance > 50) { refreshData(); } pullDistance = 0; pulling = false;"
        >
          <!-- Pull indicator -->
          <div
            class="flex justify-center items-center overflow-hidden transition-all duration-200"
            :style="'height:' + pullDistance + 'px'"
          >
            <div
              x-show="pullDistance > 10"
              class="flex items-center gap-2 text-xs text-[#8E887F]"
            >
              <iconify-icon
                icon="solar:refresh-linear"
                class="text-lg"
                :class="pullDistance > 50 ? 'text-[#E85D00]' : ''"
              ></iconify-icon>
              <span
                x-text="pullDistance > 50 ? t('Relâcher pour rafraîchir', 'Release to refresh') : t('Tirer pour rafraîchir', 'Pull to refresh')"
              ></span>
            </div>
          </div>
          <!-- Skeleton loading -->
          <div x-show="loading" class="flex flex-col">
            <template x-for="i in 6" :key="i">
              <div class="p-5 border-b border-white/[0.03] animate-pulse">
                <div class="flex justify-between items-start mb-3">
                  <div class="h-3 bg-white/[0.06] rounded w-32"></div>
                  <div class="h-4 bg-white/[0.06] rounded w-16"></div>
                </div>
                <div class="h-4 bg-white/[0.06] rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-white/[0.04] rounded w-full mb-1"></div>
                <div class="h-3 bg-white/[0.04] rounded w-2/3"></div>
              </div>
            </template>
          </div>
          <div x-show="!loading" class="flex flex-col">
            <template x-for="bm in filtered" :key="bm.tweet_id">
              <div
                class="p-5 border-b border-white/[0.03] cursor-pointer relative overflow-hidden transition-colors"
                :class="{
                  'bg-[#1C1A17]/40': selectedBm && selectedBm.tweet_id === bm.tweet_id,
                  'bg-[#34C759]/[0.03] hover:bg-[#34C759]/[0.06]': bm.verdict === 'SIGNAL' && !(selectedBm && selectedBm.tweet_id === bm.tweet_id),
                  'bg-[#FFCC00]/[0.02] hover:bg-[#FFCC00]/[0.05]': bm.verdict === 'MIXED' && !(selectedBm && selectedBm.tweet_id === bm.tweet_id),
                  'bg-[#FF3B30]/[0.02] hover:bg-[#FF3B30]/[0.05]': bm.verdict === 'NOISE' && !(selectedBm && selectedBm.tweet_id === bm.tweet_id),
                  'hover:bg-[#1C1A17]/20': !bm.verdict && !(selectedBm && selectedBm.tweet_id === bm.tweet_id)
                }"
                @click="selectedBm = bm"
              >
                <div class="flex justify-between items-start mb-2">
                  <div class="flex items-center gap-2 text-xs text-[#8E887F]">
                    <iconify-icon
                      :icon="bm.url && bm.url.includes('github') ? 'solar:code-square-linear' : bm.url && bm.url.startsWith('file://') ? 'solar:document-linear' : 'solar:hashtag-linear'"
                      class="text-sm"
                    ></iconify-icon>
                    <span x-text="'@' + bm.author_username"></span>
                    <span>·</span>
                    <span
                      x-text="bm.created_at ? bm.created_at.slice(0, 10) : ''"
                    ></span>
                  </div>
                  <span
                    class="px-2 py-0.5 rounded text-[10px] font-medium tracking-wide uppercase"
                    :class="bm.verdict === 'SIGNAL' ? 'bg-[#34C759]/10 text-[#34C759]' : bm.verdict === 'MIXED' ? 'bg-[#FFCC00]/10 text-[#FFCC00]' : bm.verdict === 'NOISE' ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : 'bg-white/5 text-[#8E887F]'"
                    x-text="bm.verdict || 'Pending'"
                  >
                  </span>
                </div>
                <h3
                  class="text-base font-medium tracking-tight mb-1.5 leading-snug"
                  :class="selectedBm && selectedBm.tweet_id === bm.tweet_id ? 'text-white' : 'text-[#E5E1DB]'"
                  x-text="getTitle(bm)"
                ></h3>
                <p
                  class="text-sm text-[#8E887F] line-clamp-2 leading-relaxed font-light"
                  x-text="[bm.translation, bm.eli5, bm.summary, bm.conclusion].find(s => s && !s.trim().startsWith('{')) || ((/^https?:\/\/\S+$/.test((bm.content||'').trim())) ? bm.url : (bm.content || '').slice(0, 150))"
                ></p>
                <div class="hidden md:flex flex-wrap gap-1.5 mt-2">
                  <template
                    x-for="tag in (bm.tags || []).slice(0, 3)"
                    :key="tag"
                  >
                    <span
                      class="px-2 py-1 rounded bg-white/5 text-xs text-[#A19B92]"
                      x-text="tag"
                    ></span>
                  </template>
                </div>
              </div>
            </template>
            <div x-show="filtered.length === 0" class="p-12 text-center">
              <iconify-icon
                icon="solar:clipboard-remove-linear"
                class="text-4xl text-[#6B665F] mx-auto mb-3"
              ></iconify-icon>
              <p class="text-sm text-[#8E887F] font-light">
                <span x-text="t('Aucun contenu ne correspond aux filtres.', 'No content matches the filters.')"></span>
              </p>
            </div>
          </div>
          </div>
        </div>
      </section>

      <!-- ═══ RIGHT COLUMN: Detail / Analysis / Backlog / Brief ═══ -->
      <section
        class="flex-1 flex flex-col bg-[#0A0907] relative z-10 overflow-hidden"
        :class="{ 'hidden md:flex': !selectedBm && tab === 'bookmarks' }"
      >
        <!-- Toast -->
        <div
          x-show="toast"
          x-transition
          x-cloak
          class="fixed top-4 right-4 z-[100] max-w-sm px-4 py-3 rounded-2xl text-sm shadow-2xl border flex items-start gap-3"
          :class="toastType === 'error' ? 'bg-[#1C1A17] border-[#FF3B30]/30 text-[#FF3B30]' : 'bg-[#1C1A17] border-[#34C759]/30 text-[#34C759]'"
        >
          <iconify-icon
            :icon="toastType === 'error' ? 'solar:danger-circle-linear' : 'solar:check-circle-linear'"
            class="text-lg shrink-0 mt-0.5"
          ></iconify-icon>
          <span x-text="toast" class="font-light text-[#E5E1DB]"></span>
          <button
            x-show="_toastRetry"
            @click="_toastRetry && _toastRetry(); toast = ''"
            class="ml-2 px-2 py-0.5 rounded text-xs font-medium bg-white/10 text-white hover:bg-white/20 transition-colors shrink-0"
          >Retry</button>
        </div>

        <!-- ── Bookmarks Detail View ── -->
        <template x-if="tab === 'bookmarks'">
          <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Empty state (no selection) -->
            <div
              x-show="!selectedBm"
              class="flex-1 flex items-center justify-center"
            >
              <div class="max-w-md w-full px-6">
                <!-- Stats row -->
                <div class="flex justify-center gap-6 mb-10" x-show="counts.signal + counts.mixed + counts.noise > 0">
                  <div class="text-center">
                    <div class="text-2xl font-semibold text-[#34C759]" x-text="counts.signal || 0"></div>
                    <div class="text-xs text-[#8E887F] mt-0.5">Signal</div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-semibold text-[#FFCC00]" x-text="counts.mixed || 0"></div>
                    <div class="text-xs text-[#8E887F] mt-0.5">Mixed</div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-semibold text-[#FF3B30]" x-text="counts.noise || 0"></div>
                    <div class="text-xs text-[#8E887F] mt-0.5">Noise</div>
                  </div>
                </div>

                <!-- Onboarding steps -->
                <div class="space-y-4" x-show="counts.signal + counts.mixed + counts.noise === 0">
                  <p class="text-lg font-medium text-white text-center mb-6" x-text="t('Pour commencer', 'Getting started')"></p>
                  <div class="flex items-start gap-4 p-4 rounded-xl bg-[#1C1A17] border border-white/5">
                    <div class="w-7 h-7 rounded-full bg-[#E85D00] flex items-center justify-center text-white text-xs font-semibold shrink-0">1</div>
                    <div>
                      <p class="text-sm font-medium text-white" x-text="t('Colle un lien', 'Paste a link')"></p>
                      <p class="text-xs text-[#8E887F] mt-0.5" x-text="t('Tweet, article, repo GitHub — dans le champ en haut à gauche', 'Tweet, article, GitHub repo — in the field at the top left')"></p>
                    </div>
                  </div>
                  <div class="flex items-start gap-4 p-4 rounded-xl bg-[#1C1A17] border border-white/5">
                    <div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[#8E887F] text-xs font-semibold shrink-0">2</div>
                    <div>
                      <p class="text-sm font-medium text-[#D1CBC4]" x-text="t('Ou connecte X', 'Or connect X')"></p>
                      <p class="text-xs text-[#8E887F] mt-0.5" x-text="t('Importe tes bookmarks Twitter automatiquement', 'Import your Twitter bookmarks automatically')"></p>
                    </div>
                  </div>
                  <div class="flex items-start gap-4 p-4 rounded-xl bg-[#1C1A17] border border-white/5">
                    <div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[#8E887F] text-xs font-semibold shrink-0">3</div>
                    <div>
                      <p class="text-sm font-medium text-[#D1CBC4]" x-text="t('Lance l\'analyse', 'Run the analysis')"></p>
                      <p class="text-xs text-[#8E887F] mt-0.5" x-text="t('Claude + Exa vérifient chaque contenu et classent Signal / Mixed / Noise', 'Claude + Exa verify each content and classify Signal / Mixed / Noise')"></p>
                    </div>
                  </div>
                </div>

                <!-- Returning user: pick a content -->
                <div x-show="counts.signal + counts.mixed + counts.noise > 0" class="text-center space-y-4">
                  <p class="text-sm text-[#8E887F]">
                    <span x-text="t('Sélectionne un contenu dans la liste', 'Select a content from the list')"></span>
                  </p>
                  <div class="flex justify-center gap-4 text-[11px] text-[#6B665F]">
                    <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#34C759]"></span> <span x-text="t('Signal = haute valeur', 'Signal = high value')"></span></span>
                    <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#FFCC00]"></span> <span x-text="t('Mixed = avec réserves', 'Mixed = with caveats')"></span></span>
                    <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#FF3B30]"></span> <span x-text="t('Noise = à ignorer', 'Noise = skip')"></span></span>
                  </div>
                  <p class="text-[11px] text-[#6B665F]">
                    <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">/</kbd> <span x-text="t('rechercher', 'search')"></span>
                    · <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">j</kbd><kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">k</kbd> <span x-text="t('naviguer', 'navigate')"></span>
                    · <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">esc</kbd> <span x-text="t('fermer', 'close')"></span>
                  </p>
                </div>
              </div>
            </div>

            <!-- Detail Panel (selected bookmark) -->
            <template x-if="selectedBm">
              <div class="flex-1 flex flex-col overflow-hidden fade-in">
                <!-- Detail Header -->
                <div
                  class="h-14 border-b border-white/[0.05] flex items-center justify-between px-6 bg-[#0A0907] z-20 shrink-0"
                >
                  <div class="flex items-center gap-3">
                    <button
                      type="button"
                      @click="selectedBm = null"
                      class="md:hidden w-8 h-8 rounded-full bg-[#1C1A17] flex items-center justify-center text-white border border-white/5"
                    >
                      <iconify-icon
                        icon="solar:alt-arrow-left-linear"
                      ></iconify-icon>
                    </button>
                    <span class="text-sm font-medium text-[#D1CBC4]"
                      x-text="t('Rapport d\'analyse', 'Analysis Report')"></span
                    >
                    <a
                      :href="selectedBm.url"
                      target="_blank"
                      x-show="selectedBm.url && !selectedBm.url.startsWith('file://')"
                      class="px-2 py-0.5 rounded text-[10px] font-medium text-[#8E887F] hover:text-white bg-white/5 border border-white/5 transition-colors flex items-center gap-1"
                    >
                      <iconify-icon
                        icon="solar:arrow-right-up-linear"
                        class="text-xs"
                      ></iconify-icon>
                      Original
                    </a>
                  </div>
                  <button
                    type="button"
                    @click="reanalyze(selectedBm.tweet_id)"
                    :disabled="analyzing"
                    class="px-3 py-1.5 rounded-lg border border-white/10 text-xs font-medium text-[#E5E1DB] hover:bg-white/5 transition-colors disabled:opacity-50"
                  >
                    <span x-text="t('Re-analyser', 'Re-analyze')"></span>
                  </button>
                </div>

                <!-- Content (Scrollable) -->
                <div
                  class="flex-1 overflow-y-auto no-scrollbar px-4 md:px-6 lg:px-12 pt-6 md:pt-8 pb-[180px] mask-fade-bottom"
                >
                  <div id="sgnl-share-card" class="max-w-5xl mx-auto flex flex-col gap-5 p-4 -m-4 rounded-3xl">

                    <!-- ═══════ HEADER & ACTIONS ═══════ -->
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 pb-2">
                      <div class="flex-1">
                        <div class="flex flex-wrap gap-1.5 mb-3" x-show="selectedBm.tags && selectedBm.tags.length">
                          <template x-for="tag in (selectedBm.tags || []).slice(0, 4)" :key="tag">
                            <span class="px-2 py-0.5 rounded text-[10px] font-medium text-[#8E887F] bg-white/[0.04] border border-white/[0.04]" x-text="tag"></span>
                          </template>
                        </div>
                        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white leading-tight mb-2" x-text="getTitle(selectedBm)"></h1>
                        <div class="flex items-center gap-2 text-xs text-[#6B665F]">
                          <span x-text="'@' + (selectedBm.author_username || selectedBm.author_name || '')"></span>
                          <span class="text-white/10">•</span>
                          <span x-text="selectedBm.created_at ? selectedBm.created_at.slice(0, 10) : ''"></span>
                        </div>
                      </div>
                      
                      <!-- Actions moved to top for easy access/sharing -->
                      <div class="flex flex-wrap md:flex-nowrap gap-2 shrink-0" data-html2canvas-ignore="true">
                        <button type="button" @click="exportImage()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-[#D1CBC4] bg-[#14120F] hover:bg-[#1C1A17] border border-white/[0.08] transition-colors">
                          <iconify-icon icon="solar:camera-linear" class="text-sm text-[#8E887F]"></iconify-icon>
                          <span class="hidden md:inline" x-text="t('Image', 'Image')"></span>
                        </button>
                        <button type="button" @click="copyAnalysis()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-[#D1CBC4] bg-[#14120F] hover:bg-[#1C1A17] border border-white/[0.08] transition-colors">
                          <iconify-icon icon="solar:copy-linear" class="text-sm text-[#8E887F]"></iconify-icon>
                          <span class="hidden md:inline" x-text="t('Texte', 'Text')"></span>
                        </button>
                        <a :href="selectedBm.url" target="_blank" x-show="selectedBm.url && !selectedBm.url.startsWith('file://')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-[#D1CBC4] bg-[#14120F] hover:bg-[#1C1A17] border border-white/[0.08] transition-colors">
                          <iconify-icon icon="solar:arrow-right-up-linear" class="text-sm text-[#8E887F]"></iconify-icon>
                          <span class="hidden md:inline">Original</span>
                        </a>
                        <button type="button" @click="openChat()" class="flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold text-white bg-[#E85D00] hover:bg-[#FF6B0A] shadow-lg shadow-[#E85D00]/20 transition-all">
                          <iconify-icon icon="solar:chat-round-dots-bold" class="text-sm"></iconify-icon>
                          <span x-text="t('Discuter', 'Discuss')"></span>
                        </button>
                      </div>
                    </div>

                    <!-- ═══════ BENTO GRID ═══════ -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-5">
                      
                      <!-- ── COLONNE GAUCHE (7 cols) ── -->
                      <div class="lg:col-span-7 flex flex-col gap-4 md:gap-5">
                        
                        <!-- HERO SCORE CARD (Shareable) -->
                        <div class="rounded-2xl bg-[#14120F] border border-white/[0.06] p-6 relative overflow-hidden flex flex-col items-center justify-center text-center min-h-[220px]">
                          <!-- Glow effect based on verdict -->
                          <div class="absolute inset-0 opacity-[0.08] pointer-events-none"
                               :class="selectedBm.verdict === 'SIGNAL' ? 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#34C759] via-[#14120F] to-[#14120F]' : selectedBm.verdict === 'NOISE' ? 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#FF3B30] via-[#14120F] to-[#14120F]' : selectedBm.verdict === 'MIXED' ? 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#FFCC00] via-[#14120F] to-[#14120F]' : 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white/20 via-[#14120F] to-[#14120F]'"></div>
                          
                          <div class="relative z-10 flex flex-col items-center">
                            <div class="text-[10px] font-bold tracking-widest text-[#8E887F] uppercase mb-2">SGNL Score</div>
                            
                            <div class="text-5xl md:text-6xl font-black tracking-tighter mb-4 uppercase drop-shadow-xl"
                                 :class="selectedBm.verdict === 'SIGNAL' ? 'text-[#34C759]' : selectedBm.verdict === 'NOISE' ? 'text-[#FF3B30]' : selectedBm.verdict === 'MIXED' ? 'text-[#FFCC00]' : 'text-[#8E887F]'"
                                 x-text="selectedBm.verdict || 'PENDING'">
                            </div>
                            
                            <!-- Metrics Pills in Hero -->
                            <div class="flex flex-wrap justify-center gap-2" x-show="getMetrics(selectedBm).length > 0">
                              <template x-for="m in getMetrics(selectedBm)" :key="m.label">
                                <span
                                  class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-medium border bg-[#0B0A08]/50 backdrop-blur-sm"
                                  :class="m.warn ? 'text-[#FF3B30] border-[#FF3B30]/20' : 'text-[#D1CBC4] border-white/[0.08]'"
                                >
                                  <iconify-icon :icon="m.icon" class="text-xs" :class="m.warn ? 'text-[#FF3B30]' : 'text-[#8E887F]'"></iconify-icon>
                                  <span x-text="m.count"></span>
                                  <span x-text="m.label"></span>
                                </span>
                              </template>
                            </div>
                          </div>
                        </div>

                        <!-- RESUME -->
                        <div x-show="selectedBm.eli5" class="p-6 rounded-2xl bg-[#14120F] border border-white/[0.04] flex-1">
                          <div class="flex items-center gap-2 mb-4">
                            <div class="w-6 h-6 rounded-full bg-[#E85D00]/10 flex items-center justify-center">
                              <iconify-icon icon="solar:document-text-bold" class="text-[#E85D00] text-xs"></iconify-icon>
                            </div>
                            <span class="text-xs font-bold text-white tracking-wide" x-text="t('Résumé', 'Summary')"></span>
                          </div>
                          <p class="text-[15px] text-[#D1CBC4] leading-relaxed" x-text="selectedBm.eli5"></p>
                        </div>

                        <!-- CONCLUSION -->
                        <div x-show="selectedBm.conclusion" class="p-6 rounded-2xl bg-[#14120F] border border-white/[0.04]">
                          <div class="flex items-center gap-2 mb-4">
                            <div class="w-6 h-6 rounded-full bg-[#34C759]/10 flex items-center justify-center">
                              <iconify-icon icon="solar:chat-square-check-bold" class="text-[#34C759] text-xs"></iconify-icon>
                            </div>
                            <span class="text-xs font-bold text-white tracking-wide">Conclusion</span>
                          </div>
                          <div class="text-sm text-[#D1CBC4] leading-relaxed" x-html="renderContent(selectedBm.conclusion)"></div>
                        </div>

                      </div>

                      <!-- ── COLONNE DROITE (5 cols) ── -->
                      <div class="lg:col-span-5 flex flex-col gap-4 md:gap-5">
                        
                        <!-- FACT CHECK -->
                        <div x-show="selectedBm.claims_check && selectedBm.claims_check !== 'N/A'" class="p-6 rounded-2xl bg-[#14120F] border border-white/[0.04]">
                          <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                              <div class="w-6 h-6 rounded-full bg-[#FFCC00]/10 flex items-center justify-center">
                                <iconify-icon icon="solar:shield-check-bold" class="text-[#FFCC00] text-xs"></iconify-icon>
                              </div>
                              <span class="text-xs font-bold text-white tracking-wide" x-text="t('Vérification', 'Fact Check')"></span>
                            </div>
                            <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-white/[0.04] text-[#8E887F]" x-text="((selectedBm.claims_check.match(/Claim\s*:/gi) || []).length || '0') + ' claims'"></span>
                          </div>
                          <div class="text-sm leading-relaxed" x-html="renderClaims(selectedBm.claims_check)"></div>
                        </div>

                        <!-- RED FLAGS -->
                        <div x-show="selectedBm.red_flags && selectedBm.red_flags !== 'Aucun' && selectedBm.red_flags !== 'N/A'" class="p-6 rounded-2xl bg-[#14120F] border border-white/[0.04]">
                          <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                              <div class="w-6 h-6 rounded-full bg-[#FF3B30]/10 flex items-center justify-center">
                                <iconify-icon icon="solar:danger-triangle-bold" class="text-[#FF3B30] text-xs"></iconify-icon>
                              </div>
                              <span class="text-xs font-bold text-white tracking-wide">Red Flags</span>
                            </div>
                            <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-[#FF3B30]/10 text-[#FF3B30]" x-text="parseRedFlags(selectedBm.red_flags).length"></span>
                          </div>
                          <div class="flex flex-wrap gap-2">

    <script>
      function app() {
        return {
          tab: "bookmarks",
          loading: true,
          bookmarks: [],
          stats: {},
          counts: {},
          connected: false,
          importing: false,
          analyzing: false,
          analyzeProgress: "",
          showAddPanel: false,
          filtersOpen: false,
          addUrls: "",
          addFiles: null,
          toast: "",
          toastType: "ok",
          _toastRetry: null,
          adHocLoading: false,
          sortBy: "fetched_desc",
          filter: { verdict: "", tag: "", search: "" },
          dateFrom: "",
          dateTo: "",
          briefRequest: "",
          briefQuality: "2",
          generatingBrief: false,
          currentBrief: null,
          briefPromptTab: "cursor",
          briefs: [],
          selectedBm: null,
          refreshing: false,
          pullStartY: 0,
          pulling: false,
          pullDistance: 0,
          chatOpen: false,
          chatMessages: [],
          chatInput: "",
          chatLoading: false,
          chatStatusText: "",
          chatMode: "bookmark",
          chatBriefId: null,
          chatBriefData: null,
          lang: localStorage.getItem("sgnl-lang") || "fr",

          get allTags() {
            const tagMap = {};
            for (const bm of this.bookmarks) {
              for (const t of bm.tags || []) {
                const key = t.trim().toLowerCase();
                if (key) tagMap[key] = (tagMap[key] || 0) + 1;
              }
            }
            return Object.entries(tagMap)
              .sort((a, b) => b[1] - a[1])
              .map(([tag]) => tag);
          },

          get backlogIdeaCount() {
            const g = this.backlogProjects;
            let n = 0;
            for (const arr of Object.values(g)) {
              if (Array.isArray(arr)) n += arr.length;
            }
            return n;
          },

          async init() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");
            if (code) {
              window.history.replaceState({}, "", "/");
              try {
                const r = await fetch("/api/oauth/callback", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ code, state: state || "" }),
                });
                const d = await r.json();
                if (d.connected) {
                  this.connected = true;
                  this.showToast(this.t("X connecté", "X connected"));
                } else {
                  this.showToast(d.error || this.t("Erreur connexion X", "X connection error"), "error");
                }
              } catch (e) {
                this.showToast(this.t("Erreur callback OAuth", "OAuth callback error"), "error");
              }
            }
            await this.loadData();
            this.loading = false;
            await this.loadBriefs();
            this.$watch("lang", (v) => localStorage.setItem("sgnl-lang", v));
          },

          setLang(v) {
            this.lang = v;
          },

          t(fr, en) {
            return this.lang === "en" ? en : fr;
          },

          _isUsableText(s) {
            if (!s) return false;
            const t = s.trim();
            if (t.startsWith('{') || t.startsWith('[')) return false;
            if (/^https?:\/\/\S+$/.test(t)) return false;
            return true;
          },

          _cleanTitle(text) {
            if (!text) return '';
            let clean = text.replace(/https?:\/\/t\.co\/\S+/g, '').replace(/https?:\/\/\S+/g, '').replace(/\s{2,}/g, ' ').trim();
            if (clean.endsWith(':')) clean = clean.slice(0, -1).trim();
            return clean;
          },

          getTitle(bm) {
            const raw = bm.content || "";
            const isUrlOnly = /^https?:\/\/\S+$/.test(raw.trim());
            if (isUrlOnly || !this._isUsableText(raw)) {
              const fallback = [bm.eli5, bm.summary, bm.conclusion]
                .find(s => this._isUsableText(s));
              if (fallback) {
                const line = fallback.split(/\n/)[0].trim();
                return line.length > 100 ? line.slice(0, 97) + "..." : line;
              }
              return bm.author_name
                ? this.t(`Article de @${bm.author_username}`, `Post by @${bm.author_username}`)
                : this.t("Article X", "X Post");
            }
            const source =
              this.needsTranslation(raw) && (bm.summary || bm.eli5)
                ? bm.summary || bm.eli5
                : raw;
            const cleaned = this._cleanTitle(source.split(/\n/)[0]);
            if (!cleaned) return bm.author_name || this.t("Sans titre", "Untitled");
            if (cleaned.length > 100) return cleaned.slice(0, 97) + "...";
            return cleaned;
          },

          needsTranslation(content) {
            if (!content) return false;
            const sample = content.slice(0, 200);
            const nonLatin = (
              sample.match(
                /[^\u0000-\u024F\u1E00-\u1EFF\s\d.,!?@#$%&*(){}[\]:;"'<>/\\|`~\-_+=^]/g,
              ) || []
            ).length;
            return nonLatin > sample.length * 0.15;
          },

          parseRedFlags(text) {
            if (!text || text === 'Aucun' || text === 'N/A') return [];
            const raw = text.split(/[.!]\s+/).map(s => s.trim().replace(/\.$/, '')).filter(s => s.length > 5);
            return raw.map(s => {
              const words = s.split(/\s+/);
              if (words.length <= 4) return s;
              const short = s.match(/^([^:,–—]+)/);
              return short ? short[1].trim() : words.slice(0, 4).join(' ');
            }).filter(s => s.length > 3 && s.length < 40).slice(0, 5);
          },

          getMetrics(bm) {
            const m = [];
            if (bm.web_research_summary) {
              const mentions = (bm.web_research_summary.match(/Reddit|HackerNews|Hacker News|Medium|article|forum|blog|Twitter|GitHub/gi) || []);
              m.push({ icon: 'solar:global-search-linear', label: 'sources', count: Math.max(mentions.length, 1) });
            }
            if (bm.red_flags && bm.red_flags !== 'Aucun' && bm.red_flags !== 'N/A') {
              const n = this.parseRedFlags(bm.red_flags).length;
              if (n > 0) m.push({ icon: 'solar:danger-triangle-linear', label: 'red flags', count: n, warn: true });
            }
            if (bm.feature_ideas) {
              const n = (bm.feature_ideas.match(/[•\-]\s/g) || []).length || 1;
              m.push({ icon: 'solar:lightbulb-bolt-linear', label: this.t('idees', 'ideas'), count: n });
            }
            if (bm.claims_check && bm.claims_check !== 'N/A') {
              const n = (bm.claims_check.match(/Claim\s*:/gi) || []).length;
              if (n > 0) m.push({ icon: 'solar:shield-check-linear', label: 'claims', count: n });
            }
            return m;
          },

          copyAnalysis() {
            const bm = this.selectedBm;
            if (!bm) return;
            const parts = [];
            parts.push(`${bm.verdict || '—'} | ${this.getTitle(bm)}`);
            if (bm.eli5) parts.push(`\n${bm.eli5}`);
            if (bm.conclusion) parts.push(`\n${this.t('Conclusion', 'Conclusion')}:\n${bm.conclusion}`);
            if (bm.red_flags && bm.red_flags !== 'Aucun' && bm.red_flags !== 'N/A') parts.push(`\n⚠ ${bm.red_flags}`);
            if (bm.tags && bm.tags.length) parts.push(`\n#${bm.tags.join(' #')}`);
            navigator.clipboard.writeText(parts.join('\n')).then(() => this.showToast(this.t('Copie !', 'Copied!')));
          },

          async exportImage() {
            const card = document.getElementById('sgnl-share-card');
            if (!card || typeof html2canvas === 'undefined') return;
            
            this.showToast(this.t("Génération de l'image...", "Generating image..."));
            
            try {
              const canvas = await html2canvas(card, {
                backgroundColor: '#0A0907',
                scale: 2,
                useCORS: true,
                ignoreElements: (el) => el.hasAttribute('data-html2canvas-ignore')
              });

            } catch (err) {

              this.showToast(this.t("Erreur lors de l'export", "Error exporting image"));
            }
          },

          getKeyPoints(bm) {
            const points = [];
            if (bm.eli5) points.push(bm.eli5);
            if (bm.conclusion) {
              const sentences = bm.conclusion.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
              if (sentences.length > 0) points.push(sentences[0]);
              if (sentences.length > 1) points.push(sentences[sentences.length - 1]);
            }
            if (bm.red_flags && bm.red_flags !== 'Aucun' && bm.red_flags !== 'N/A') {
              const first = bm.red_flags.split(/[.!?]\s/)[0];
              if (first && first.length > 10) points.push(first + '.');
            }
            if (bm.feature_ideas) {
              const bullets = bm.feature_ideas.match(/[•\-]\s*\[?[^\]]*\]?\s*([^•\-\n]+)/);
              if (bullets) points.push(bullets[0].replace(/^[•\-]\s*/, '').trim());
            }
            return points.slice(0, 4);
          },

          _esc(text) {
            if (!text) return '';
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          },

          renderContent(text) {
            if (!text) return '';
            let h = this._esc(text);
            h = h.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-medium">$1</strong>');
            h = h.replace(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" class="text-[#E85D00] hover:underline">$1</a>');
            const lines = h.split('\n');
            let out = '', inList = false;
            for (const line of lines) {
              const bullet = line.match(/^\s*[•\-]\s+(.+)/);
              if (bullet) {
                if (!inList) { out += '<ul class="space-y-2 my-2">'; inList = true; }
                out += `<li class="flex gap-2 items-start"><span class="text-[#E85D00] mt-0.5 shrink-0">&#8226;</span><span>${bullet[1]}</span></li>`;
              } else {
                if (inList) { out += '</ul>'; inList = false; }
                if (line.trim()) out += `<p class="mb-2">${line}</p>`;
              }
            }
            if (inList) out += '</ul>';
            return out;
          },

          renderClaims(text) {
            if (!text) return '';
            let h = this._esc(text);
            const blocks = h.split(/(?=Claim\s*:)/i).filter(b => b.trim());
            if (!/Claim\s*:/i.test(h)) return this.renderContent(text);
            return '<div class="space-y-3">' + blocks.map(block => {
              const isConfirmed = /confirm|vérifi|vérifié|partiellement/i.test(block);
              const isDenied = /infirm|non.?v[ée]rifi|non.?confirm|trompeu/i.test(block);
              const claimMatch = block.match(/Claim\s*:\s*(?:&[^;]+;\s*)?['"]?(.+?)['"]?\s*(?:→|[-–—]&gt;|$)/i);
              const claimText = claimMatch ? claimMatch[1].replace(/['"]$/, '').trim() : '';
              const proofMatch = block.match(/(?:→|[-–—]&gt;)\s*(.+)/i);
              const proofText = proofMatch ? proofMatch[1].trim() : '';
              const iconClass = isDenied ? 'text-[#FF3B30]' : isConfirmed ? 'text-[#34C759]' : 'text-[#FFCC00]';
              const icon = isDenied ? '&#10005;' : isConfirmed ? '&#10003;' : '~';
              const claimStyle = isDenied ? 'line-through opacity-60' : '';
              return `<div class="flex gap-3 items-start py-2">
                <span class="${iconClass} font-bold text-sm mt-0.5 shrink-0 w-4 text-center">${icon}</span>
                <div class="min-w-0">
                  <p class="text-sm text-white font-medium ${claimStyle}">${claimText || this._esc(block.slice(0, 60))}</p>
                  ${proofText ? `<p class="text-xs text-[#8E887F] mt-1 leading-relaxed">${proofText}</p>` : ''}
                </div>
              </div>`;
            }).join('') + '</div>';
          },

          applyDateFilter() {
            this.dateFrom = this.$refs.dateFromInput.value || "";
            this.dateTo = this.$refs.dateToInput.value || "";
          },

          clearDateFilters() {
            this.dateFrom = "";
            this.dateTo = "";
            this.filter.tag = "";
          },

          async refreshData() {
            this.refreshing = true;
            await this.loadData();
            await this.loadBriefs();
            this.refreshing = false;
            this.showToast(this.t("Données actualisées", "Data refreshed"));
          },

          async loadData() {
            try {
              const r = await fetch("/api/data");
              const d = await r.json();
              this.bookmarks = d.bookmarks.map((b) => ({ ...b, _open: false }));
              this.stats = d.stats;
              this.counts = d.counts;
              this.connected = d.connected;
            } catch (e) {
              this.showToast(this.t("Erreur de chargement", "Loading error"), "error");
            }
          },

          get filtered() {
            let list = this.bookmarks;
            const f = this.filter;
            const df = this.dateFrom;
            const dt = this.dateTo;
            if (f.verdict) {
              if (f.verdict === "NONE")
                list = list.filter((b) => !b.has_analysis);
              else list = list.filter((b) => b.verdict === f.verdict);
            }
            if (f.tag) {
              const tags = f.tag
                .toLowerCase()
                .split(",")
                .map((t) => t.trim());
              list = list.filter((b) =>
                (b.tags || []).some((t) =>
                  tags.some((ft) => t.toLowerCase().includes(ft)),
                ),
              );
            }
            if (f.search) {
              const q = f.search.toLowerCase();
              list = list.filter(
                (b) =>
                  (b.content || "").toLowerCase().includes(q) ||
                  (b.summary || "").toLowerCase().includes(q) ||
                  (b.author_username || "").toLowerCase().includes(q),
              );
            }
            if (df || dt) {
              const getDate = (b) => {
                const d = b.created_at || "";
                return d ? d.slice(0, 10) : "";
              };
              if (df) list = list.filter((b) => getDate(b) >= df);
              if (dt) list = list.filter((b) => getDate(b) <= dt);
            }
            const vOrder = { SIGNAL: 0, MIXED: 1, NOISE: 2, "": 3 };
            const sorters = {
              created_desc: (a, b) =>
                (b.created_at || "").localeCompare(a.created_at || ""),
              created_asc: (a, b) =>
                (a.created_at || "").localeCompare(b.created_at || ""),
              fetched_desc: (a, b) => {
                const fa = (a.fetched_at || a.created_at || "").slice(0, 19);
                const fb = (b.fetched_at || b.created_at || "").slice(0, 19);
                const cmp = fb.localeCompare(fa);
                return cmp !== 0 ? cmp : (b.created_at || "").localeCompare(a.created_at || "");
              },
              fetched_asc: (a, b) => {
                const fa = (a.fetched_at || a.created_at || "").slice(0, 19);
                const fb = (b.fetched_at || b.created_at || "").slice(0, 19);
                const cmp = fa.localeCompare(fb);
                return cmp !== 0 ? cmp : (a.created_at || "").localeCompare(b.created_at || "");
              },
              verdict: (a, b) =>
                (vOrder[a.verdict] ?? 3) - (vOrder[b.verdict] ?? 3),
              author: (a, b) =>
                (a.author_username || "").localeCompare(
                  b.author_username || "",
                ),
            };
            const fn = sorters[this.sortBy];
            if (fn) list = [...list].sort(fn);
            return list;
          },

          get filteredPending() {
            return this.filtered.filter((b) => !b.has_analysis);
          },

          get backlogProjects() {
            const PROJECTS = {
              "AI Agent Company": [
                "ai",
                "agent",
                "llm",
                "mcp",
                "automation",
                "rag",
                "nlp",
                "gpt",
                "claude",
                "openai",
                "langchain",
              ],
              Ledger: [
                "crypto",
                "web3",
                "defi",
                "blockchain",
                "wallet",
                "nft",
                "bitcoin",
                "ethereum",
                "ledger",
              ],
              WhoGhost: [
                "instagram",
                "social media",
                "tracking",
                "follower",
                "unfollower",
                "social",
              ],
              "Groove Candy": [
                "music",
                "audio",
                "distribution",
                "streaming",
                "spotify",
                "sound",
              ],
              "General / Divers": [],
            };
            const groups = {};
            const analyzed = this.bookmarks.filter(
              (b) => b.has_analysis && b.actionable && b.actionable !== "N/A",
            );
            for (const bm of analyzed) {
              const actions = (bm.actionable || "")
                .split(/[\n•\-]/)
                .filter((a) => a.trim().length > 15);
              for (const action of actions) {
                const txt = action.trim();
                const low = (
                  txt +
                  " " +
                  (bm.tags || []).join(" ")
                ).toLowerCase();
                let matched = "General / Divers";
                for (const [proj, kws] of Object.entries(PROJECTS)) {
                  if (proj === "General / Divers") continue;
                  if (kws.some((k) => low.includes(k))) {
                    matched = proj;
                    break;
                  }
                }
                const verdictScore =
                  bm.verdict === "SIGNAL" ? 3 : bm.verdict === "MIXED" ? 2 : 1;
                const lengthBonus = Math.min(txt.length / 100, 2);
                const score = Math.min(
                  10,
                  Math.round((verdictScore * 2 + lengthBonus) * 10) / 10,
                );
                if (!groups[matched]) groups[matched] = [];
                groups[matched].push({
                  text: txt,
                  author: bm.author_username,
                  verdict: bm.verdict,
                  url: bm.url,
                  score,
                });
              }
            }
            for (const k of Object.keys(groups)) {
              groups[k].sort((a, b) => b.score - a.score);
            }
            return groups;
          },

            this.selectedBm = list[Math.min(idx + 1, list.length - 1)];
